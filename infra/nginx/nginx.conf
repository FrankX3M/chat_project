# Проксирование REST + WS на единый origin (см. project-structure.md, infra/nginx/).
# Фронтенд (clients/web) ходит только по относительным путям — при переезде на
# внешний VPS + домен здесь достаточно добавить server_name и TLS (443/certbot),
# сам фронтенд трогать не придётся.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream backend {
        server server:8000;
    }

    server {
        listen 80;
        # listen 443 ssl; + ssl_certificate/ssl_certificate_key — добавить при
        # переезде на VPS с доменом (например через certbot).
        server_name _;

        # --- статика фронтенда ---
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # --- REST API ---
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- WebSocket (единый сокет поиск+чат, см. shared/ws-events.md) ---
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;   # держим сокет открытым долго — чат "живёт" всё время
        }

        # --- служебное / Swagger (удобно для отладки, не для клиентов) ---
        location /health { proxy_pass http://backend; }
        location /docs { proxy_pass http://backend; }
        location /redoc { proxy_pass http://backend; }
        location /openapi.json { proxy_pass http://backend; }
    }
}
