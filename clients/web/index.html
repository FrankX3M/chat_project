<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Анонимный чат</title>
<style>
  :root {
    --bg: #12141a;
    --panel: #181b23;
    --panel-2: #20242f;
    --border: #2a2f3d;
    --text: #eef0f4;
    --text-dim: #9096a6;
    --accent: #3d6fd8;
    --accent-hover: #4a7de6;
    --accent-2: #34c281;
    --danger: #e5534b;
    --pill-bg: #2a2f3d;
    --pill-text: #cfd3dc;
  }
  html[data-theme="light"] {
    --bg: #f4f5f8;
    --panel: #ffffff;
    --panel-2: #f0f1f5;
    --border: #e2e4ea;
    --text: #1c1f27;
    --text-dim: #6b7180;
    --accent: #3d6fd8;
    --accent-hover: #2f5fc4;
    --accent-2: #1f9d63;
    --danger: #d3453d;
    --pill-bg: #eceef3;
    --pill-text: #4b5160;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    transition: background 0.2s, color 0.2s;
  }
  .app {
    width: 100%;
    max-width: 640px;
  }
  .brand {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 24px;
    letter-spacing: 0.2px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 28px 24px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.25);
  }
  .hidden { display: none !important; }

  /* ---- группы кнопок-переключателей ---- */
  .group { margin-bottom: 24px; }
  .group-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .pills { display: flex; gap: 10px; flex-wrap: wrap; }
  .pills.stacked { flex-direction: column; }
  .pill {
    flex: 1;
    min-width: 90px;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: var(--pill-bg);
    color: var(--pill-text);
    font-size: 13.5px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s, color 0.15s, opacity 0.15s;
  }
  .pill:hover:not(.disabled) { filter: brightness(1.1); }
  .pill.selected { background: var(--accent); color: white; }
  .pill.disabled { opacity: 0.35; cursor: not-allowed; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 520px) {
    .two-col { grid-template-columns: 1fr; }
  }

  .checkbox-row {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--text-dim);
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 20px;
    cursor: pointer;
  }
  .checkbox-row input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

  .cta {
    display: block;
    width: 100%;
    padding: 15px;
    border-radius: 999px;
    border: 2px solid var(--accent-2);
    background: transparent;
    color: var(--accent-2);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .cta:hover:not(:disabled) { background: var(--accent-2); color: #08130d; }
  .cta:disabled { opacity: 0.4; cursor: not-allowed; }

  .validation {
    text-align: center; color: var(--danger); font-size: 13px;
    margin-top: 12px; min-height: 16px;
  }

  .footer-note {
    text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-dim);
  }
  .footer-note b { color: var(--text); }

  .banner {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 20px;
    font-size: 13px; color: var(--text-dim); text-align: center;
  }
  .banner.error { color: var(--danger); border-color: var(--danger); }
  .banner button { margin-top: 8px; }

  /* ---- экран поиска ---- */
  .searching-wrap { text-align: center; padding: 40px 20px; }
  .spinner {
    width: 52px; height: 52px; margin: 0 auto 24px;
    border-radius: 50%;
    border: 4px solid var(--panel-2);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .searching-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .searching-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 28px; }

  /* ---- экран чата ---- */
  .chat-header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--border);
    font-size: 13px; color: var(--text-dim);
  }
  #messages {
    height: 380px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px;
    padding: 4px 2px 12px;
  }
  .msg {
    max-width: 78%; padding: 9px 13px; border-radius: 14px;
    font-size: 14px; line-height: 1.42; word-wrap: break-word;
  }
  .msg.me { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
  .msg.partner { align-self: flex-start; background: var(--panel-2); border-bottom-left-radius: 4px; }
  .msg.system { align-self: center; background: transparent; color: var(--text-dim); font-size: 12px; margin: 4px 0; }
  .typing-indicator { font-size: 12px; color: var(--text-dim); font-style: italic; height: 18px; padding-left: 4px; }

  .composer { display: flex; gap: 8px; margin-top: 12px; }
  .composer input {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 12px 14px; border-radius: 12px; font-size: 14px; outline: none;
  }
  .composer input:focus { border-color: var(--accent); }
  .btn-row { display: flex; gap: 10px; margin-top: 12px; }
  .btn {
    padding: 12px 18px; border-radius: 10px; border: none; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: white; }
  .btn.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn.danger { background: var(--danger); color: white; }
  .btn:hover { filter: brightness(1.08); }
  .send-btn { padding: 12px 20px; }
</style>
</head>
<body>
<div class="app">
  <div class="brand">Анонимный чат</div>

  <div id="loadingBanner" class="banner">Подключаемся…</div>
  <div id="errorBanner" class="banner error hidden">
    Не удалось подключиться к серверу.
    <div><button class="btn ghost" id="retryBtn">Повторить</button></div>
  </div>

  <div id="settingsCard" class="card hidden">
    <div class="group">
      <div class="group-title">Тема общения:</div>
      <div class="pills" id="topicPills"></div>
    </div>

    <div class="two-col">
      <div class="group">
        <div class="group-title">Ваш пол:</div>
        <div class="pills" id="ownGenderPills"></div>
      </div>
      <div class="group">
        <div class="group-title">Пол собеседника:</div>
        <div class="pills" id="partnerGenderPills"></div>
      </div>
    </div>

    <div class="two-col">
      <div class="group">
        <div class="group-title">Ваш возраст:</div>
        <div class="pills stacked" id="ownAgePills"></div>
      </div>
      <div class="group">
        <div class="group-title">Возраст собеседника:</div>
        <div class="pills stacked" id="partnerAgePills"></div>
      </div>
    </div>

    <label class="checkbox-row hidden" id="adultCheckRow">
      <input type="checkbox" id="adultCheck" />
      Я подтверждаю, что мне есть 18 лет
    </label>

    <div class="group">
      <div class="group-title">Цветовая схема:</div>
      <div class="pills" id="themePills"></div>
    </div>

    <button class="cta" id="startChatBtn">Начать чат</button>
    <div class="validation hidden" id="validationMsg"></div>
  </div>

  <div id="searchingCard" class="card hidden">
    <div class="searching-wrap">
      <div class="spinner"></div>
      <div class="searching-title" id="searchingTitle">Ищём собеседника…</div>
      <div class="searching-sub" id="searchingSub">Обычно это занимает несколько секунд</div>
      <button class="btn ghost" id="cancelSearchBtn">Отменить</button>
    </div>
  </div>

  <div id="chatCard" class="card hidden">
    <div class="chat-header">
      <span id="chatRoomLabel">Собеседник найден</span>
    </div>
    <div id="messages"></div>
    <div class="typing-indicator hidden" id="typingIndicator">собеседник печатает…</div>
    <div class="composer">
      <input type="text" id="messageInput" placeholder="Напишите сообщение…" autocomplete="off" />
      <button class="btn primary send-btn" id="sendBtn">Отправить</button>
    </div>
    <div class="btn-row">
      <button class="btn primary" id="nextBtn">Далее</button>
      <button class="btn danger" id="stopBtn">Стоп</button>
    </div>
  </div>

  <div class="footer-note" id="onlineNote"></div>
</div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------
  // Конфигурация: всё относительно текущего адреса страницы. Когда сайт
  // переедет на VPS/домен (nginx проксирует /api и /ws на тот же origin),
  // ничего в этом файле менять не нужно.
  // ---------------------------------------------------------------------
  const API_BASE = window.location.origin + '/api/v1';
  const WS_BASE = (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host + '/ws/connect';
  const DEVICE_ID_KEY = 'anon_chat_device_id';

  const TOPICS = [
    { key: 'general', label: 'Общение' },
    { key: 'flirt18', label: 'Флирт 18+' },
    { key: 'roleplay', label: 'Ролка' },
  ];
  const OWN_GENDERS = [
    { key: 'unspecified', label: 'Некто' },
    { key: 'male', label: 'М' },
    { key: 'female', label: 'Ж' },
  ];
  const PARTNER_GENDERS = [
    { key: 'unspecified', label: 'Не важно' },
    { key: 'male', label: 'М' },
    { key: 'female', label: 'Ж' },
  ];
  const AGE_BUCKETS = [
    { key: 'u17', label: 'до 17 лет', min: 13, max: 17, adult: false },
    { key: '18-21', label: 'от 18 до 21 года', min: 18, max: 21, adult: true },
    { key: '22-25', label: 'от 22 до 25 лет', min: 22, max: 25, adult: true },
    { key: '26-35', label: 'от 26 до 35 лет', min: 26, max: 35, adult: true },
    { key: '36+', label: 'старше 36 лет', min: 36, max: 99, adult: true },
  ];
  const THEMES = [
    { key: 'light', label: 'Светлая' },
    { key: 'dark', label: 'Тёмная' },
  ];
  const MIN_ADULT_AGE = 18;

  const $ = (id) => document.getElementById(id);
  const els = {
    loadingBanner: $('loadingBanner'), errorBanner: $('errorBanner'), retryBtn: $('retryBtn'),
    settingsCard: $('settingsCard'), searchingCard: $('searchingCard'), chatCard: $('chatCard'),
    topicPills: $('topicPills'), ownGenderPills: $('ownGenderPills'), partnerGenderPills: $('partnerGenderPills'),
    ownAgePills: $('ownAgePills'), partnerAgePills: $('partnerAgePills'), themePills: $('themePills'),
    adultCheckRow: $('adultCheckRow'), adultCheck: $('adultCheck'),
    startChatBtn: $('startChatBtn'), validationMsg: $('validationMsg'),
    searchingTitle: $('searchingTitle'), searchingSub: $('searchingSub'), cancelSearchBtn: $('cancelSearchBtn'),
    chatRoomLabel: $('chatRoomLabel'), messages: $('messages'), typingIndicator: $('typingIndicator'),
    messageInput: $('messageInput'), sendBtn: $('sendBtn'), nextBtn: $('nextBtn'), stopBtn: $('stopBtn'),
    onlineNote: $('onlineNote'),
  };

  let form = {
    topic: 'general',
    ownGender: 'unspecified',
    partnerGender: 'unspecified',
    ownAgeKey: null,
    partnerAgeKey: null,
    theme: 'dark',
    adultChecked: false,
  };

  let session = { accessToken: null, userId: null, ws: null, roomId: null, wsShouldReconnect: true };
  let typingState = { lastSent: 0, timeout: null };
  let onlinePollTimer = null;

  function bucketByKey(key) { return AGE_BUCKETS.find((b) => b.key === key) || null; }
  function bucketByAge(age) { return AGE_BUCKETS.find((b) => b.min === age) || null; }
  function bucketByRange(min, max) { return AGE_BUCKETS.find((b) => b.min === min && b.max === max) || null; }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
  }

  // ---------------------------------------------------------------------
  // Рендер групп кнопок-переключателей
  // ---------------------------------------------------------------------
  function renderPillGroup(container, options, selectedKey, onSelect, opts) {
    opts = opts || {};
    container.innerHTML = '';
    options.forEach((opt) => {
      const btn = document.createElement('div');
      const isDisabled = opts.isDisabled ? opts.isDisabled(opt) : false;
      btn.className = 'pill' + (opt.key === selectedKey ? ' selected' : '') + (isDisabled ? ' disabled' : '');
      btn.textContent = opt.label;
      btn.onclick = () => { if (!isDisabled) onSelect(opt.key); };
      container.appendChild(btn);
    });
  }

  function renderAll() {
    renderPillGroup(els.topicPills, TOPICS, form.topic, (key) => {
      form.topic = key;
      if (key !== 'flirt18') { form.adultChecked = false; els.adultCheck.checked = false; }
      if (key === 'flirt18' && form.ownAgeKey) {
        const b = bucketByKey(form.ownAgeKey);
        if (b && !b.adult) form.ownAgeKey = null;
      }
      renderAll();
    });

    renderPillGroup(els.ownGenderPills, OWN_GENDERS, form.ownGender, (key) => { form.ownGender = key; renderAll(); });
    renderPillGroup(els.partnerGenderPills, PARTNER_GENDERS, form.partnerGender, (key) => { form.partnerGender = key; renderAll(); });

    renderPillGroup(els.ownAgePills, AGE_BUCKETS, form.ownAgeKey, (key) => { form.ownAgeKey = key; renderAll(); }, {
      isDisabled: (b) => form.topic === 'flirt18' && !b.adult,
    });
    renderPillGroup(els.partnerAgePills, AGE_BUCKETS, form.partnerAgeKey, (key) => { form.partnerAgeKey = key; renderAll(); });

    renderPillGroup(els.themePills, THEMES, form.theme, (key) => { form.theme = key; applyTheme(key); renderAll(); });

    els.adultCheckRow.classList.toggle('hidden', form.topic !== 'flirt18');
    els.adultCheck.checked = form.adultChecked;

    els.validationMsg.classList.add('hidden');
  }

  els.adultCheck.onchange = () => { form.adultChecked = els.adultCheck.checked; };

  function validateForm() {
    if (form.topic === 'flirt18') {
      if (!form.ownAgeKey) return 'Укажите свой возраст, чтобы выбрать тему "Флирт 18+"';
      const b = bucketByKey(form.ownAgeKey);
      if (!b || !b.adult) return 'Тема "Флирт 18+" доступна только с 18 лет';
      if (!form.adultChecked) return 'Подтвердите, что вам есть 18 лет';
    }
    return null;
  }

  // ---------------------------------------------------------------------
  // Экраны
  // ---------------------------------------------------------------------
  function showScreen(name) {
    els.settingsCard.classList.toggle('hidden', name !== 'settings');
    els.searchingCard.classList.toggle('hidden', name !== 'searching');
    els.chatCard.classList.toggle('hidden', name !== 'chat');
  }

  // ---------------------------------------------------------------------
  // API
  // ---------------------------------------------------------------------
  async function apiFetch(path, opts) {
    const resp = await fetch(API_BASE + path, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        ...(session.accessToken ? { Authorization: 'Bearer ' + session.accessToken } : {}),
        ...(opts && opts.headers),
      },
    });
    if (!resp.ok) {
      let detail = '';
      try { detail = (await resp.json()).detail; } catch (e) { /* noop */ }
      const err = new Error(detail || (path + ' -> ' + resp.status));
      err.status = resp.status;
      throw err;
    }
    return resp.status === 204 ? null : resp.json();
  }

  function getDeviceId() {
    let id = localStorage.getItem(DEVICE_ID_KEY);
    if (!id) {
      id = 'web-' + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now());
      localStorage.setItem(DEVICE_ID_KEY, id);
    }
    return id;
  }

  async function bootstrap() {
    els.loadingBanner.classList.remove('hidden');
    els.errorBanner.classList.add('hidden');
    showScreen(null);
    try {
      const auth = await apiFetch('/auth/anonymous', {
        method: 'POST',
        body: JSON.stringify({ device_id: getDeviceId() }),
      });
      session.accessToken = auth.access_token;
      session.userId = auth.user_id;

      const settings = await apiFetch('/settings');
      form.ownGender = settings.gender;
      form.partnerGender = settings.preferred_partner_gender;
      form.theme = settings.color_theme === 'light' ? 'light' : 'dark';
      form.topic = settings.preferred_topic || 'general';
      form.adultChecked = !!settings.is_age_verified;
      const ownBucket = settings.age != null ? bucketByAge(settings.age) : null;
      form.ownAgeKey = ownBucket ? ownBucket.key : null;
      const partnerBucket = (settings.preferred_age_min != null && settings.preferred_age_max != null)
        ? bucketByRange(settings.preferred_age_min, settings.preferred_age_max) : null;
      form.partnerAgeKey = partnerBucket ? partnerBucket.key : null;

      applyTheme(form.theme);
      renderAll();
      connectWs();
      pollOnlineCount();
      onlinePollTimer = setInterval(pollOnlineCount, 15000);

      els.loadingBanner.classList.add('hidden');
      showScreen('settings');
    } catch (e) {
      els.loadingBanner.classList.add('hidden');
      els.errorBanner.classList.remove('hidden');
    }
  }

  els.retryBtn.onclick = bootstrap;

  async function pollOnlineCount() {
    try {
      const data = await apiFetch('/stats/online');
      els.onlineNote.innerHTML = 'Находятся в чате: <b>' + data.online + '</b> ' + pluralUsers(data.online);
    } catch (e) { /* тихо игнорируем — счётчик не критичен */ }
  }

  function pluralUsers(n) {
    const mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return 'пользователь';
    if ([2, 3, 4].includes(mod10) && ![12, 13, 14].includes(mod100)) return 'пользователя';
    return 'пользователей';
  }

  // ---------------------------------------------------------------------
  // WebSocket
  // ---------------------------------------------------------------------
  function connectWs() {
    const ws = new WebSocket(WS_BASE + '?token=' + encodeURIComponent(session.accessToken));
    session.ws = ws;

    ws.onclose = () => {
      if (session.wsShouldReconnect) setTimeout(connectWs, 2000);
    };
    ws.onmessage = (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch (err) { return; }
      handleServerEvent(data);
    };
  }

  function sendWs(event, payload) {
    if (!session.ws || session.ws.readyState !== WebSocket.OPEN) return;
    session.ws.send(JSON.stringify({ event, payload: payload || {} }));
  }

  function handleServerEvent(data) {
    switch (data.event) {
      case 'queue_position':
        els.searchingSub.textContent = 'Позиция в очереди: ' + data.payload.position;
        break;
      case 'matched':
        session.roomId = data.payload.room_id;
        els.messages.innerHTML = '';
        els.chatRoomLabel.textContent = 'Собеседник найден';
        addMessage('Собеседник найден. Будьте вежливы!', 'system');
        showScreen('chat');
        break;
      case 'message':
        addMessage(data.payload.content, 'partner');
        break;
      case 'typing':
        els.typingIndicator.classList.toggle('hidden', !data.payload.is_typing);
        break;
      case 'partner_left':
        addMessage('Собеседник покинул чат', 'system');
        session.roomId = null;
        setTimeout(() => showScreen('settings'), 1200);
        break;
      case 'error':
        addMessage('Ошибка: ' + data.payload.message, 'system');
        break;
    }
  }

  function addMessage(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    els.messages.appendChild(div);
    els.messages.scrollTop = els.messages.scrollHeight;
  }

  // ---------------------------------------------------------------------
  // Действия пользователя
  // ---------------------------------------------------------------------
  function currentSearchPayload() {
    const partnerBucket = form.partnerAgeKey ? bucketByKey(form.partnerAgeKey) : null;
    return {
      topic: form.topic,
      partner_gender: form.partnerGender,
      partner_age_min: partnerBucket ? partnerBucket.min : null,
      partner_age_max: partnerBucket ? partnerBucket.max : null,
    };
  }

  async function saveSettingsAndSearch() {
    const error = validateForm();
    if (error) {
      els.validationMsg.textContent = error;
      els.validationMsg.classList.remove('hidden');
      return;
    }
    els.startChatBtn.disabled = true;
    try {
      const ownBucket = form.ownAgeKey ? bucketByKey(form.ownAgeKey) : null;
      const search = currentSearchPayload();
      await apiFetch('/settings', {
        method: 'PUT',
        body: JSON.stringify({
          gender: form.ownGender,
          age: ownBucket ? ownBucket.min : null,
          self_declared_adult: form.topic === 'flirt18' ? form.adultChecked : false,
          preferred_topic: search.topic,
          preferred_partner_gender: search.partner_gender,
          preferred_age_min: search.partner_age_min,
          preferred_age_max: search.partner_age_max,
          color_theme: form.theme,
          is_18_plus_mode: form.topic === 'flirt18',
        }),
      });

      els.searchingTitle.textContent = 'Ищём собеседника…';
      els.searchingSub.textContent = 'Обычно это занимает несколько секунд';
      showScreen('searching');
      await apiFetch('/search/start', { method: 'POST', body: JSON.stringify(search) });
    } catch (e) {
      els.validationMsg.textContent = e.status === 429
        ? 'Слишком много попыток, подождите немного и повторите'
        : 'Не получилось начать поиск, попробуйте ещё раз';
      els.validationMsg.classList.remove('hidden');
      showScreen('settings');
    } finally {
      els.startChatBtn.disabled = false;
    }
  }

  els.startChatBtn.onclick = saveSettingsAndSearch;

  els.cancelSearchBtn.onclick = async () => {
    try { await apiFetch('/search/cancel', { method: 'POST' }); } catch (e) { /* noop */ }
    showScreen('settings');
  };

  function sendMessage() {
    const content = els.messageInput.value.trim();
    if (!content || !session.roomId) return;
    sendWs('message', { room_id: session.roomId, content });
    addMessage(content, 'me');
    els.messageInput.value = '';
  }
  els.sendBtn.onclick = sendMessage;
  els.messageInput.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };
  els.messageInput.oninput = () => {
    if (!session.roomId) return;
    const now = Date.now();
    if (now - typingState.lastSent > 1200) {
      sendWs('typing', { room_id: session.roomId, is_typing: true });
      typingState.lastSent = now;
    }
    clearTimeout(typingState.timeout);
    typingState.timeout = setTimeout(() => sendWs('typing', { room_id: session.roomId, is_typing: false }), 1500);
  };

  els.stopBtn.onclick = () => {
    if (session.roomId) sendWs('leave', { room_id: session.roomId });
    session.roomId = null;
    showScreen('settings');
  };

  els.nextBtn.onclick = async () => {
    if (session.roomId) sendWs('leave', { room_id: session.roomId });
    session.roomId = null;
    els.searchingTitle.textContent = 'Ищём нового собеседника…';
    els.searchingSub.textContent = 'Обычно это занимает несколько секунд';
    showScreen('searching');
    try {
      await apiFetch('/search/start', { method: 'POST', body: JSON.stringify(currentSearchPayload()) });
    } catch (e) {
      showScreen('settings');
    }
  };

  window.addEventListener('beforeunload', () => { session.wsShouldReconnect = false; });

  bootstrap();
})();
</script>
</body>
</html>
